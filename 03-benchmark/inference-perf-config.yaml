# inference-perf-config.yaml — Workload spec for the inference-perf benchmark.
# This is the same config used for both stacks (Stack A and Stack B) so the
# comparison is apples-to-apples. The Job templates (run-benchmark-*.yaml)
# mount this as a ConfigMap and pass the target URL via env var.
#
# inference-perf is the Kubernetes-native benchmarking tool used by GKE's
# Inference Quickstart. It sweeps QPS, finds the latency knee, and emits
# both summary metrics and per-request traces.

apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-perf-config
  namespace: bench
data:
  config.yaml: |
    # ---------- Load shape ----------
    # Stages = a staircase of QPS levels. The harness runs each level for
    # `duration` seconds and records all metrics; the post-run analysis finds
    # the highest QPS at which p99 TPOT stays under the SLO.
    load:
      type: constant
      stages:
        - { rate: 1,   duration: 60 }    # warmup
        - { rate: 5,   duration: 120 }
        - { rate: 10,  duration: 120 }
        - { rate: 20,  duration: 120 }
        - { rate: 40,  duration: 120 }
        - { rate: 80,  duration: 120 }
        - { rate: 160, duration: 120 }   # most setups saturate before this
        - { rate: 320, duration: 60 }

    # ---------- Dataset ----------
    # ShareGPT = real chat conversations, mixed input/output lengths, varied
    # prefix structure. The right call to showcase llm-d's prefix-cache win.
    # For a pure synthetic stress test, swap `type: synthetic` with explicit
    # input/output token distributions.
    data:
      type: shareGPT

    # ---------- Target API ----------
    api:
      type: completion
      streaming: true              # measure TTFT properly

    # ---------- Server connection (filled in per stack) ----------
    server:
      type: vllm                   # OpenAI-compatible endpoint
      base_url: "${BASE_URL}"      # injected by Job env var
      model_name: "google/gemma-3n-E4B-it"

    # ---------- Tokenizer (must match the served model) ----------
    tokenizer:
      pretrained_model_name_or_path: "google/gemma-3n-E4B-it"

    # ---------- Output metrics ----------
    metrics:
      type: prometheus
      prometheus:
        google_managed_prometheus: true
        url: ""                    # auto-discovered when running on GKE

    # ---------- SLOs (used by knee-finder) ----------
    # These define what "max sustainable throughput" means. Customer should
    # set their own. Defaults below are reasonable for an interactive chatbot.
    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: false         # set true for very deep dives; large output
      slo:
        ttft_p99_ms: 500           # time-to-first-token, p99 ≤ 500ms
        tpot_p99_ms: 50            # time-per-output-token, p99 ≤ 50ms
